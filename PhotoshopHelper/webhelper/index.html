<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#fff4ea">
    <title>WebHelper</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./app.css">
</head>

<body>
    <div class="bg-art" aria-hidden="true"></div>
    <div class="toast-stack" id="toasts"></div>

    <div class="app no-results" id="app">
        <header class="topbar">
            <div class="topbar-left">
                <a class="brand" href="./" title="WebHelper">
                    <img src="./assets/plugin-icon.png" alt="">
                    <span class="brand-name">Web<span class="brand-slash">Helper</span></span>
                </a>
                <span class="status bad" id="connection-status" title="Disconnected">Disconnected</span>
            </div>
            <div class="stage-slot">
                <div class="stage" id="global-stage" data-drop-target="stage" title="Dump — leftover images for any task">
                    <div class="stage-label">Dump</div>
                    <div class="stage-strip" id="stage-strip"></div>
                </div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary" id="btn-t2i" type="button" title="New text-to-image task">New T2I</button>
                <button class="btn" id="btn-image" type="button" title="New image-to-image task (or drop image anywhere on Results)">New I2I</button>
                <label class="task-pick hidden" id="task-pick">
                    <span class="task-dot" id="task-dot" aria-hidden="true"></span>
                    <select class="task-select" id="task-select" title="Active task"></select>
                </label>
            </div>
        </header>

        <main class="workspace">
            <aside class="pane-source" id="pane-source"></aside>
            <section class="pane-results" id="pane-results"></section>
        </main>
    </div>

    <input type="file" id="file-task" accept="image/*" hidden>
    <input type="file" id="file-refs" accept="image/*" multiple hidden>
    <input type="file" id="file-stage" accept="image/*" multiple hidden>

    <script>
        window.WHConfig = {
            tryElectronDrag(e, images) {
                if (!window.envInfo || !window.envInfo.isLocal) return false;
                if (!e.altKey) return false;
                const imageArray = Array.isArray(images) ? images : [images];
                fetch('/api/drag/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ images: imageArray })
                }).catch(() => { /* ignore: not running in Electron mode */ });
                return true;
            }
        };
        window.envInfo = { isLocal: true, isMobile: false, threadId: null };
    </script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
